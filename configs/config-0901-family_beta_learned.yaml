general:
  root_dir: null
  device: "cuda"  # Will be overridden programmatically
  dtype: "float32"  # Will be converted to torch.dtype
  seed: null
  batch_size: 512
  num_samples: 1000

model:
  batchnorm: true
  dilations: 1
  channels: [1, 8, 16, 32, 64, 128, 128, 256, 256, 3]
  kernel_sizes: [13, 13, 13, 13, 13, 13, 13, 13, 3]
  num_layers: 9
  dropout_rate: 0.2

data:
  total_duration_distribution: [100, 500]
  snr_distribution: [10, 50]
  stat_snr_distribution: 20
  duration_distribution: [5, 60]
  amplitude_distribution: null
  amplitude_by_duration_distribution: ['ModulatedGaussian', 0, 1, 1]
  refractory_distribution: [0., 1.5]
  max_submovements: null
  refractory_mode: "percentages"
  standardize: false
  one_sign_chance: 0
  hard_refractory_chance: 0
  easy_refractory_chance: 0
  noise_mode: "gaussian"
  combined_dataset: false

training:
  learning_rate: 1.0e-3
  lr_decay_start: 30
  lr_decay_end: 31
  lr_decay_total_change: 1
  num_epochs: 25
  reconstruction_loss_start: 5
  use_reconstruction_loss: false
  bn_dropout_freeze_start: 20
  start_with_weights: false
  reconstructions_to_plot: 5
  log_interval: 10
  plot_interval: 500

test:
  pre_padding: 15

paths:
  datasets_dir: "data"
  train_datasets: ["steering_tangential_velocity_data.csv", "Fitts_tangential_velocity_data.csv", "object_moving_tangential_velocity_data.csv"]
  test_datasets: ["crank_tangential_velocity_data.csv", "whacamole_tangential_velocity_data.csv", "pointing_tangential_velocity_data.csv", "tablet_writing_tangential_velocity_data.csv"]

# Shape RECOVERY, not shape mismatch. The generator is pinned to the known
# asymmetric truth (Beta mean 0.40 -> alpha 2.4, beta 3.6); the decoder starts at
# Beta(3,3) -- exactly the minimum-jerk assumption -- with both shape scalars free.
# The question is whether training pulls the decoder off minimum jerk and onto the
# truth. Correct answer: primitive_beta_mean -> 0.40, primitive_beta_precision -> 6.0.
#
# The generator MUST be a separate frozen object. Sharing one reconstructor (the
# default) lets training cut the reconstruction loss by moving the ground truth
# instead of fitting it, which leaves the shape unidentifiable.
primitive:
  primitive_family: "beta"
  primitive_beta_mean: [0.5, 0.0]
  primitive_beta_precision: [6.0, 0.0]
  freeze_primitive_parameters: false
  generator_primitive_family: "beta"
  generator_primitive_beta_mean: [0.40, 0.0]
  generator_primitive_beta_precision: [6.0, 0.0]
