[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sssumo"
version = "0.1.0"
description = "Real-Time Semi-Supervised Submovement Decomposition"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Evgenii Rudakov"},
    {name = "Jonathan Shock"},
    {name = "Otto Lappi"},
    {name = "Benjamin Ultan Cowley"}
]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "torch",
    "wandb",
    "scikit-learn",
    "fastkde",
    "tqdm",
    "torchviz",
    "seaborn",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[project.urls]
Repository = "https://github.com/dolphin-in-a-coma/sssumo"

[tool.setuptools.packages.find]
where = ["."]
include = ["sssumo*"]
